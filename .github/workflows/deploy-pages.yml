name: Sync official logo into site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Insert logo into index.html
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          css_marker = '/* Stand Up Guys official logo sizing */'
          logo_css = '''
/* Stand Up Guys official logo sizing */
.brand-logo {
  display: block;
  width: auto;
  height: 70px;
  max-width: 140px;
  object-fit: contain;
  object-position: center;
  flex: 0 0 auto;
}
.footer-brand .brand-logo {
  height: 135px;
  max-width: 260px;
}
@media (max-width: 760px) {
  .brand-logo {
    height: 56px;
    max-width: 112px;
  }
  .footer-brand .brand-logo {
    height: 108px;
    max-width: 210px;
  }
}
'''
          if css_marker not in s:
              s = s.replace('</style>', logo_css + '\n</style>', 1)

          header_old = '<a class="brand" href="#home" aria-label="Stand Up Guys home"><span class="brand-mark" aria-hidden="true"><span>SUG</span></span><span class="brand-type"><strong>Stand Up Guys</strong><small>Youth Mentor</small></span></a>'
          header_new = '<a class="brand" href="#home" aria-label="Stand Up Guys home"><img class="brand-logo" src="assets/stand-up-guys-logo.png" alt="Stand Up Guys Youth Mentor logo"></a>'
          footer_old = '<a class="brand footer-brand" href="#home"><span class="brand-mark" aria-hidden="true"><span>SUG</span></span><span class="brand-type"><strong>Stand Up Guys</strong><small>Youth Mentor</small></span></a>'
          footer_new = '<a class="brand footer-brand" href="#home"><img class="brand-logo" src="assets/stand-up-guys-logo.png" alt="Stand Up Guys Youth Mentor logo"></a>'

          s = s.replace(header_old, header_new, 1)
          s = s.replace(footer_old, footer_new, 1)
          p.write_text(s)
          PY

      - name: Commit site update if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "Logo already synced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Render official Stand Up Guys logo"
          git push origin HEAD:main
