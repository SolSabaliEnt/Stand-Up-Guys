name: Deploy Stand Up Guys to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site with responsive logo
        run: |
          mkdir -p _site
          cp -R . _site/
          rm -rf _site/.git _site/.github
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('_site/index.html')
          s = p.read_text()

          logo_css = r'''
/* Stand Up Guys official logo sizing */
.brand-logo {
  display: block;
  width: auto;
  height: 68px;
  max-width: 112px;
  object-fit: contain;
  object-position: center;
  flex: 0 0 auto;
}
.footer-brand .brand-logo {
  height: 118px;
  max-width: 190px;
}
@media (max-width: 760px) {
  .brand-logo {
    height: 56px;
    max-width: 92px;
  }
  .footer-brand .brand-logo {
    height: 96px;
    max-width: 155px;
  }
}
'''

          if '/* Stand Up Guys official logo sizing */' not in s:
              s = s.replace('</style>', logo_css + '\n</style>', 1)

          brand_pattern = re.compile(r'(<a\s+class="brand(?:\s+footer-brand)?"[^>]*>).*?(</a>)', re.S)
          occurrence = 0

          def replace_brand(match):
              global occurrence
              occurrence += 1
              opening = match.group(1)
              closing = match.group(2)
              is_footer = 'footer-brand' in opening
              img_class = 'brand-logo'
              img = '<img class="{}" src="assets/stand-up-guys-logo.png" alt="Stand Up Guys Youth Mentor logo">'.format(img_class)
              return opening + img + closing

          s = brand_pattern.sub(replace_brand, s)
          p.write_text(s)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
