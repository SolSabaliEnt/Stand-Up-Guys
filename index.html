<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stand Up Guys Youth Mentor | Detroit</title>
<script>
(async function(){
  const res = await fetch('site.html', {cache:'no-store'});
  let s = await res.text();
  const css = `
/* Official Stand Up Guys logo */
.brand-logo{display:block;width:auto;height:70px;max-width:140px;object-fit:contain;object-position:center;flex:0 0 auto}
.footer-brand .brand-logo{height:135px;max-width:260px}
@media(max-width:780px){.brand-logo{height:56px;max-width:112px}.footer-brand .brand-logo{height:108px;max-width:210px}}
@media(max-width:520px){.brand-logo{height:52px;max-width:104px}}
`;
  s = s.replace('</style>', css + '</style>');
  s = s.replace(
    '<a class="brand" href="#home" aria-label="Stand Up Guys home"><span class="brand-mark" aria-hidden="true"><span>SUG</span></span><span class="brand-type"><strong>Stand Up Guys</strong><small>Youth Mentor</small></span></a>',
    '<a class="brand" href="#home" aria-label="Stand Up Guys home"><img class="brand-logo" src="assets/stand-up-guys-logo.png" alt="Stand Up Guys Youth Mentor logo"></a>'
  );
  s = s.replace(
    '<a class="brand footer-brand" href="#home"><span class="brand-mark" aria-hidden="true"><span>SUG</span></span><span class="brand-type"><strong>Stand Up Guys</strong><small>Youth Mentor</small></span></a>',
    '<a class="brand footer-brand" href="#home"><img class="brand-logo" src="assets/stand-up-guys-logo.png" alt="Stand Up Guys Youth Mentor logo"></a>'
  );
  document.open();
  document.write(s);
  document.close();
})().catch(function(){ location.href='site.html'; });
</script>
</head>
<body></body>
</html>
