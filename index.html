<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stand Up Guys Youth Mentor | Detroit</title>
<script>
(async function(){
  const res = await fetch('site.html', {cache:'no-store'});
  let s = await res.text();

  const css = `
/* Official Stand Up Guys logo treatment */
.brand-logo,
.hero-card-logo {
  display:block;
  width:auto;
  object-fit:contain;
  object-position:center;
  filter:brightness(0) invert(1);
}

/* Header */
.brand-logo {
  height:64px;
  max-width:150px;
  flex:0 0 auto;
}

/* Footer */
.footer-brand .brand-logo {
  height:118px;
  max-width:250px;
}

/* Replace the SUG monogram inside the hero card */
.hero-card-logo-wrap {
  display:grid;
  place-items:center;
  min-height:150px;
  margin:24px 0 10px;
  border-block:1px solid rgba(255,255,255,.13);
}
.hero-card-logo {
  height:118px;
  max-width:235px;
}
.hero-monogram { display:none !important; }

@media(max-width:780px){
  .brand-logo{height:54px;max-width:126px}
  .footer-brand .brand-logo{height:104px;max-width:220px}
  .hero-card-logo{height:98px;max-width:205px}
}
@media(max-width:520px){
  .brand-logo{height:50px;max-width:116px}
  .footer-brand .brand-logo{height:94px;max-width:200px}
  .hero-card-logo-wrap{min-height:125px}
  .hero-card-logo{height:88px;max-width:185px}
}
`;

  s = s.replace('</style>', css + '</style>');

  s = s.replace(
    '<a class="brand" href="#home" aria-label="Stand Up Guys home"><span class="brand-mark" aria-hidden="true"><span>SUG</span></span><span class="brand-type"><strong>Stand Up Guys</strong><small>Youth Mentor</small></span></a>',
    '<a class="brand" href="#home" aria-label="Stand Up Guys home"><img class="brand-logo" src="assets/stand-up-guys-logo.png" alt="Stand Up Guys Youth Mentor logo"></a>'
  );

  s = s.replace(
    '<div class="hero-monogram" aria-hidden="true">SUG</div>',
    '<div class="hero-card-logo-wrap" aria-hidden="true"><img class="hero-card-logo" src="assets/stand-up-guys-logo.png" alt=""></div>'
  );

  s = s.replace(
    '<a class="brand footer-brand" href="#home"><span class="brand-mark" aria-hidden="true"><span>SUG</span></span><span class="brand-type"><strong>Stand Up Guys</strong><small>Youth Mentor</small></span></a>',
    '<a class="brand footer-brand" href="#home" aria-label="Stand Up Guys home"><img class="brand-logo" src="assets/stand-up-guys-logo.png" alt="Stand Up Guys Youth Mentor logo"></a>'
  );

  document.open();
  document.write(s);
  document.close();
})().catch(function(){ location.href='site.html'; });
</script>
</head>
<body></body>
</html>
